[package]
name = "map-proxy-actix-web"
version = "0.1.0"
edition = "2024"
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
[dependencies]
actix-rt = "2"
actix-web = "4"
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
actix-cors = "0.7"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "chrono", "uuid"] }
serde_yaml = "0.9.33"
sqlx-sqlite = { version = "0.8" }
dashmap = "7.0.0-rc2"
reqwest = { version = "0.13", features = ["default", "query"] }
fake_user_agent = "0.2.3"
rand = "0.10.2"

[dev-dependencies]
actix-rt = "2"
